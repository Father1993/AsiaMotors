services:
  web:
    build:
      context: .
      secrets:
        - app_env
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
secrets:
  app_env:
    file: .env
